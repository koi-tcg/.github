name: Engineering task
description: Define a scoped, verifiable implementation task
title: "task: "
labels: ["triage"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What observable result is required?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List objective checks that prove completion.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Data, security, money, and operational risks
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
    validations:
      required: true
