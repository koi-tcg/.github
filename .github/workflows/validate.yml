name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: standards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check required organization files
        run: |
          test -s profile/README.md
          test -s CONTRIBUTING.md
          test -s SECURITY.md
          test -s CODE_OF_CONDUCT.md
          test -s GOVERNANCE.md
          test -s SUPPORT.md
          test -s .github/CODEOWNERS
          test -s .github/pull_request_template.md
          test -s .github/ISSUE_TEMPLATE/task.yml
          test -s workflow-templates/koi-ci.yml
          test -s workflow-templates/koi-ci.properties.json
